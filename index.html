<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Old Testament Seminary · Fall 2026</title>
  <meta name="description" content="Today’s class and the rest of the Fall 2026 Old Testament seminary pacing guide.">
  <meta name="theme-color" content="#0d2947">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seminary">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d2947;
      --navy-soft: #1c4063;
      --gold: #c4a35a;
      --gold-deep: #9a7b3c;
      --cream: #f3eee4;
      --paper: #fffcf7;
      --ink: #1d2a38;
      --muted: #667487;
      --line: rgba(13, 41, 71, 0.1);
      --life: #2f6a57;
      --mastery: #8a5a2b;
      --assess: #4c5d78;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Outfit, "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -120px, rgba(196, 163, 90, 0.16), transparent 60%),
        var(--cream);
      color: var(--ink);
      line-height: 1.45;
    }

    a { color: inherit; }

    .wrap {
      width: min(740px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 80px;
      padding-top: calc(28px + env(safe-area-inset-top));
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    header.hero {
      text-align: center;
      padding: 12px 8px 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-deep);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      line-height: 0.95;
      margin: 14px 0 8px;
      color: var(--navy);
    }

    .lede {
      margin: 0 auto;
      max-width: 34rem;
      color: var(--muted);
      font-weight: 300;
      font-size: 1.02rem;
    }

    .week {
      margin: 8px 0 32px;
    }

    .week-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: color-mix(in srgb, var(--cream) 88%, transparent);
      backdrop-filter: blur(10px);
      padding: 10px 2px 12px;
    }

    .week-head a {
      text-decoration: none;
    }

    .week-scripture {
      color: var(--gold-deep);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .week-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      margin: 2px 0 0;
      color: var(--navy);
      font-style: italic;
      font-weight: 500;
    }

    .days {
      display: grid;
      gap: 10px;
    }

    .day {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px 12px;
      display: grid;
      grid-template-columns: 4.6rem 1fr;
      gap: 12px 14px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
    }

    .day.is-today {
      border-color: color-mix(in srgb, var(--gold) 55%, var(--line));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 35%, transparent);
    }

    .datecol {
      text-align: center;
      padding-top: 4px;
    }

    .dow {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .dom {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.85rem;
      line-height: 1;
      color: var(--navy);
      font-weight: 600;
    }

    .mon {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .lessons { display: grid; gap: 8px; }

    a.row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      text-decoration: none;
      padding: 8px 8px 8px 6px;
      margin: 0 -8px;
      border-radius: 12px;
    }

    a.row:hover,
    a.row:focus-visible {
      background: rgba(13, 41, 71, 0.045);
    }

    .pill {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(13, 41, 71, 0.08);
      color: var(--navy);
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .kind-life .pill { background: rgba(47, 106, 87, 0.12); color: var(--life); }
    .kind-mastery .pill { background: rgba(138, 90, 43, 0.12); color: var(--mastery); }
    .kind-assess .pill { background: rgba(76, 93, 120, 0.12); color: var(--assess); }

    .row-title {
      font-weight: 500;
      font-size: 0.98rem;
    }

    .row-meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 1px;
    }

    .break-note {
      color: var(--muted);
      font-style: italic;
      padding: 8px 0 4px;
    }

    .previous {
      margin: 0 0 20px;
    }

    .previous summary {
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--navy-soft);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .previous summary:hover,
    .previous summary:focus-visible {
      border-color: color-mix(in srgb, var(--gold) 40%, var(--line));
    }

    .previous summary::-webkit-details-marker,
    .previous summary::marker {
      display: none;
      content: "";
    }

    .previous summary::before {
      content: "";
      width: 0.38em;
      height: 0.38em;
      border-right: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor;
      transform: rotate(-45deg);
      translate: 0 1px;
      transition: transform 0.15s ease;
    }

    .previous[open] summary::before {
      transform: rotate(45deg);
      translate: 0 -1px;
    }

    .previous[open] summary {
      margin-bottom: 16px;
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding-top: 12px;
    }

    footer a { color: var(--navy-soft); }

    .install {
      margin-top: 10px;
      font-size: 0.8rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cream: #101822;
        --paper: #182433;
        --ink: #edf2f7;
        --muted: #9aa8b7;
        --line: rgba(247, 241, 229, 0.08);
        --navy: #e8eef6;
        --navy-soft: #c9d6e5;
        --gold-deep: #d4b36a;
        color-scheme: dark;
      }
      body {
        background:
          radial-gradient(900px 420px at 50% -80px, rgba(196, 163, 90, 0.12), transparent 55%),
          #0c141d;
      }
      .week-head {
        background: color-mix(in srgb, #101822 84%, transparent);
      }
      a.row:hover, a.row:focus-visible {
        background: rgba(255, 255, 255, 0.04);
      }
      .previous summary {
        background: var(--paper);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">Fall 2026</div>
      <h1>Old Testament Seminary</h1>
      <p class="lede">Today’s class and the days ahead, each linked to the teacher manual.</p>
    </header>
    <main id="app"></main>
    <footer>
      <p>
        Lessons open in the
        <a href="https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026?lang=eng">Old Testament Seminary Teacher Manual</a>.
      </p>
      <p class="install">Add to Home Screen from your browser’s share menu to keep this guide on your phone.</p>
    </footer>
  </div>
  <script src="pacing-data.js"></script>
  <script src="pacing-lib.js"></script>
  <script>
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const KIND_LABEL = {
      scripture: "Scripture lesson",
      life: "Life Preparation",
      mastery: "Doctrinal Mastery",
      assess: "Assess Your Learning",
      break: "No school"
    };

    function isStandalone() {
      return window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;
    }

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function todayStamp() {
      const param = new URLSearchParams(location.search).get("date");
      if (param && /^\d{4}-\d{2}-\d{2}$/.test(param)) return param;
      return PacingLib.stampFromDate(new Date());
    }

    function kindLabel(lesson) {
      return KIND_LABEL[lesson.kind] || "Lesson";
    }

    function openAttrs(url) {
      const ios = isIOS();
      const standalone = isStandalone();
      const href = PacingLib.lessonUrl(url, { standalone, ios });
      const extra = (standalone || ios) ? "" : ` target="_blank" rel="noopener"`;
      return `href="${href}"${extra}`;
    }

    function lessonRow(lesson) {
      return `<a class="row kind-${lesson.kind}" ${openAttrs(lesson.url)}>
        <span class="pill">${lesson.number}</span>
        <span>
          <div class="row-title">${lesson.title}</div>
          <div class="row-meta">${kindLabel(lesson)}</div>
        </span>
      </a>`;
    }

    function dayCard(day, today) {
      const dt = PacingLib.parseDate(day.date);
      const lessons = day.kind === "break"
        ? `<div class="break-note">${day.schedule}</div>`
        : day.lessons.map((lesson) => lessonRow(lesson)).join("");
      return `<article class="day${day.date === today ? " is-today" : ""}">
        <div class="datecol">
          <div class="dow">${DOW[dt.getDay()].slice(0, 3)}</div>
          <div class="dom">${dt.getDate()}</div>
          <div class="mon">${MONTHS[dt.getMonth()].slice(0, 3)}</div>
        </div>
        <div class="lessons">${lessons}</div>
      </article>`;
    }

    function weeksHtml(weeks, today, idSuffix) {
      const suffix = idSuffix || "";
      return weeks.map((week) => {
        const headingId = `${week.id}${suffix}`;
        return `
        <section class="week" aria-labelledby="${headingId}">
          <div class="week-head">
            <a ${openAttrs(week.overviewUrl)}>
              <div class="week-scripture">${week.cfm}</div>
              <h2 class="week-title" id="${headingId}">“${week.cfmTitle}”</h2>
            </a>
          </div>
          <div class="days">
            ${week.days.map((day) => dayCard(day, today)).join("")}
          </div>
        </section>`;
      }).join("");
    }

    function emptyNote(message) {
      return `<div class="empty">${message} You can still browse the <a href="${window.PACING.manualUrl}">teacher manual</a>.</div>`;
    }

    function render() {
      const app = document.getElementById("app");
      const today = todayStamp();
      const allWeeks = window.PACING?.weeks || [];
      const upcoming = PacingLib.upcomingWeeks(allWeeks, today);
      const previous = PacingLib.previousWeeks(allWeeks, today);

      if (!upcoming.length && !previous.length) {
        app.innerHTML = emptyNote("No class days in this guide.");
        return;
      }

      const previousBlock = previous.length ? `
        <details class="previous">
          <summary>Previous lessons</summary>
          ${weeksHtml(previous, today, "-previous")}
        </details>
      ` : "";

      const upcomingBlock = upcoming.length
        ? weeksHtml(upcoming, today)
        : emptyNote("No upcoming class days.");

      app.innerHTML = previousBlock + upcomingBlock;
    }

    render();
  </script>
</body>
</html>
