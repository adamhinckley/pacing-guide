<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Old Testament Seminary · Fall 2026</title>
  <meta name="description" content="Today’s class and the rest of the Fall 2026 Old Testament seminary pacing guide.">
  <meta name="theme-color" content="#050506">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seminary">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050506;
      --ink: #f4f6fb;
      --muted: #9aa3b2;
      --faint: #6c7583;
      --gold: #ffd27a;
      --glass: rgba(255, 255, 255, 0.045);
      --glass-strong: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.26);
      --life: #62e6b4;
      --mastery: #ffb56b;
      --assess: #8fb6ff;
      --scripture: #c7b6ff;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(720px 480px at 12% -8%, rgba(143, 182, 255, 0.14), transparent 60%),
        radial-gradient(680px 460px at 92% 4%, rgba(199, 182, 255, 0.12), transparent 62%),
        radial-gradient(760px 520px at 50% 118%, rgba(98, 230, 180, 0.1), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .wrap {
      width: min(740px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 80px;
      padding-top: calc(28px + env(safe-area-inset-top));
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    header.hero {
      text-align: center;
      padding: 12px 8px 30px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 26px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .eyebrow::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    h1 {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 600;
      font-size: clamp(2.1rem, 7vw, 3.2rem);
      letter-spacing: -0.02em;
      line-height: 1.02;
      margin: 16px 0 10px;
      color: #fff;
    }

    .lede {
      margin: 0 auto;
      max-width: 34rem;
      color: var(--muted);
      font-weight: 400;
      font-size: 1rem;
    }

    .week {
      margin: 8px 0 30px;
    }

    .week-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(5, 5, 6, 0.72);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      padding: 12px 4px 14px;
    }

    .week-head a {
      text-decoration: none;
    }

    .week-scripture {
      color: var(--gold);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .week-title {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
      margin: 4px 0 0;
      color: #fff;
      font-weight: 500;
    }

    .days {
      display: grid;
      gap: 12px;
    }

    .day {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px 17px 13px;
      display: grid;
      grid-template-columns: 4.4rem 1fr;
      gap: 12px 16px;
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 12px 30px rgba(0, 0, 0, 0.4);
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    .day.is-today {
      border-color: color-mix(in srgb, var(--gold) 62%, transparent);
      background: var(--glass-strong);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 0 0 1px color-mix(in srgb, var(--gold) 34%, transparent),
        0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .datecol {
      text-align: center;
      padding-top: 3px;
    }

    .dow {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
    }

    .dom {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 2rem;
      line-height: 1;
      color: #fff;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .is-today .dom { color: var(--gold); }

    .mon {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lessons { display: grid; gap: 6px; }

    a.row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      text-decoration: none;
      padding: 8px 10px 8px 8px;
      margin: 0 -8px;
      border-radius: 14px;
      transition: background 0.15s ease;
    }

    a.row:hover,
    a.row:focus-visible {
      background: rgba(255, 255, 255, 0.06);
    }

    .pill {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 0.74rem;
      font-weight: 600;
      font-family: "Space Grotesk", Inter, sans-serif;
      background: rgba(199, 182, 255, 0.14);
      border: 1px solid rgba(199, 182, 255, 0.3);
      color: var(--scripture);
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .kind-life .pill { background: rgba(98, 230, 180, 0.14); border-color: rgba(98, 230, 180, 0.32); color: var(--life); }
    .kind-mastery .pill { background: rgba(255, 181, 107, 0.14); border-color: rgba(255, 181, 107, 0.32); color: var(--mastery); }
    .kind-assess .pill { background: rgba(143, 182, 255, 0.14); border-color: rgba(143, 182, 255, 0.32); color: var(--assess); }

    .row-title {
      font-weight: 500;
      font-size: 0.98rem;
      color: var(--ink);
    }

    .row-meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 1px;
    }

    .break-note {
      color: var(--muted);
      font-style: italic;
      padding: 8px 0 4px;
    }

    .previous {
      margin: 0 0 22px;
    }

    .previous summary {
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      color: var(--ink);
      font-size: 0.86rem;
      font-weight: 500;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .previous summary:hover,
    .previous summary:focus-visible {
      border-color: var(--border-strong);
      background: var(--glass-strong);
    }

    .previous summary::-webkit-details-marker,
    .previous summary::marker {
      display: none;
      content: "";
    }

    .previous summary::before {
      content: "";
      width: 0.4em;
      height: 0.4em;
      border-right: 1.7px solid var(--gold);
      border-bottom: 1.7px solid var(--gold);
      transform: rotate(-45deg);
      translate: 0 1px;
      transition: transform 0.15s ease;
    }

    .previous[open] summary::before {
      transform: rotate(45deg);
      translate: 0 -1px;
    }

    .previous[open] summary {
      margin-bottom: 18px;
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--faint);
      font-size: 0.85rem;
      padding-top: 12px;
    }

    footer a { color: var(--muted); }

    .install {
      margin-top: 10px;
      font-size: 0.8rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">Fall 2026</div>
      <h1>Old Testament Seminary</h1>
      <p class="lede">Today’s class and the days ahead, each linked to the teacher manual.</p>
    </header>
    <main id="app"></main>
    <footer>
      <p>
        Lessons open in the
        <a href="https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026?lang=eng">Old Testament Seminary Teacher Manual</a>.
      </p>
      <p class="install">Add to Home Screen from your browser’s share menu to keep this guide on your phone.</p>
    </footer>
  </div>
  <script src="pacing-data.js"></script>
  <script src="pacing-lib.js"></script>
  <script>
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const KIND_LABEL = {
      scripture: "Scripture lesson",
      life: "Life Preparation",
      mastery: "Doctrinal Mastery",
      assess: "Assess Your Learning",
      break: "No school"
    };
    const VERSION_KEY = "pacing-guide-version";

    function isStandalone() {
      return window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;
    }

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    async function checkForDeployedUpdate() {
      try {
        const res = await fetch("./version.json", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        const next = String(data.version || "");
        if (!next) return;
        const prev = localStorage.getItem(VERSION_KEY);
        if (prev && prev !== next) {
          localStorage.setItem(VERSION_KEY, next);
          const url = new URL(location.href);
          url.searchParams.set("_v", next);
          location.replace(url.toString());
          return;
        }
        localStorage.setItem(VERSION_KEY, next);
      } catch (_) {
        // Stay on the current build when offline or the version file is unavailable.
      }
    }

    function registerUpdateChecks() {
      checkForDeployedUpdate();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") checkForDeployedUpdate();
      });
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) checkForDeployedUpdate();
      });

      if (!("serviceWorker" in navigator)) return;

      const hadController = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController) location.reload();
      });

      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then((reg) => {
        const poke = () => reg.update();
        poke();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") poke();
        });
        window.addEventListener("pageshow", (event) => {
          if (event.persisted) poke();
        });
      }).catch(() => {});
    }

    registerUpdateChecks();

    function todayStamp() {
      const param = new URLSearchParams(location.search).get("date");
      if (param && /^\d{4}-\d{2}-\d{2}$/.test(param)) return param;
      return PacingLib.stampFromDate(new Date());
    }

    function kindLabel(lesson) {
      return KIND_LABEL[lesson.kind] || "Lesson";
    }

    function openAttrs(url) {
      const ios = isIOS();
      const standalone = isStandalone();
      const href = PacingLib.lessonUrl(url, { standalone, ios });
      const extra = (standalone || ios) ? "" : ` target="_blank" rel="noopener"`;
      return `href="${href}"${extra}`;
    }

    function lessonRow(lesson) {
      return `<a class="row kind-${lesson.kind}" ${openAttrs(lesson.url)}>
        <span class="pill">${lesson.number}</span>
        <span>
          <div class="row-title">${lesson.title}</div>
          <div class="row-meta">${kindLabel(lesson)}</div>
        </span>
      </a>`;
    }

    function dayCard(day, today) {
      const dt = PacingLib.parseDate(day.date);
      const lessons = day.kind === "break"
        ? `<div class="break-note">${day.schedule}</div>`
        : day.lessons.map((lesson) => lessonRow(lesson)).join("");
      return `<article class="day${day.date === today ? " is-today" : ""}">
        <div class="datecol">
          <div class="dow">${DOW[dt.getDay()].slice(0, 3)}</div>
          <div class="dom">${dt.getDate()}</div>
          <div class="mon">${MONTHS[dt.getMonth()].slice(0, 3)}</div>
        </div>
        <div class="lessons">${lessons}</div>
      </article>`;
    }

    function weeksHtml(weeks, today, idSuffix) {
      const suffix = idSuffix || "";
      return weeks.map((week) => {
        const headingId = `${week.id}${suffix}`;
        return `
        <section class="week" aria-labelledby="${headingId}">
          <div class="week-head">
            <a ${openAttrs(week.overviewUrl)}>
              <div class="week-scripture">${week.cfm}</div>
              <h2 class="week-title" id="${headingId}">“${week.cfmTitle}”</h2>
            </a>
          </div>
          <div class="days">
            ${week.days.map((day) => dayCard(day, today)).join("")}
          </div>
        </section>`;
      }).join("");
    }

    function emptyNote(message) {
      return `<div class="empty">${message} You can still browse the <a href="${window.PACING.manualUrl}">teacher manual</a>.</div>`;
    }

    function render() {
      const app = document.getElementById("app");
      const today = todayStamp();
      const allWeeks = window.PACING?.weeks || [];
      const upcoming = PacingLib.upcomingWeeks(allWeeks, today);
      const previous = PacingLib.previousWeeks(allWeeks, today);

      if (!upcoming.length && !previous.length) {
        app.innerHTML = emptyNote("No class days in this guide.");
        return;
      }

      const previousBlock = previous.length ? `
        <details class="previous">
          <summary>Previous lessons</summary>
          ${weeksHtml(previous, today, "-previous")}
        </details>
      ` : "";

      const upcomingBlock = upcoming.length
        ? weeksHtml(upcoming, today)
        : emptyNote("No upcoming class days.");

      app.innerHTML = previousBlock + upcomingBlock;
    }

    render();
  </script>
</body>
</html>
